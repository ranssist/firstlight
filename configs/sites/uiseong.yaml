# 의성군 안평면 일대 — 소개서 §3 시나리오의 무대.
# 2025년 3월 영남권 산불의 발화 지역이다.
name: uiseong
label: 의성군 안평면
lat: 36.4127
lon: 128.7043

# DEM 을 받아둘 범위. 최대 사거리 15km 를 감안해 약 0.35도(≈ 39km) 여유를 둔다.
bbox: [128.35, 36.06, 129.05, 36.76]

dem:
  cache_dir: data/dem/uiseong

  # 작품설명서가 지정한 DEM 은 **국토지리정보원 5m 급**이다. 회원가입 후
  # 수동 내려받기라 자동화할 수 없어 기본값은 Copernicus 30m(무인증)이다.
  # 5m DEM 을 받아 아래 디렉터리에 넣으면 그쪽이 우선 적용된다.
  # (NASA SRTM 30m 도 검토했으나 2026년 기준 실제 파일 내려받기는 NASA
  #  Earthdata 로그인이 필요해 자동화 불가 — 해상도도 Copernicus 30m 와
  #  동급이라 실익이 없다. 아래는 비워 둔 채 Copernicus 30m 를 계속 쓴다.)
  # local_dir: data/dem/uiseong_ngii_5m
  # Copernicus DEM 은 EGM2008 정표고 기준이다.
  # 텔레메트리 고도가 WGS84 타원체고라면 한국 기준 약 -25.0 을 넣어야 한다.
  # 0.0 = "텔레메트리가 이미 정표고(MSL)".
  geoid_offset_m: 0.0

# 순찰 기본 고도 (지표 기준).
patrol_altitude_agl_m: 300.0

# 최근접 진화대 — 경보에 거리를 함께 실어 보내고 지도에 겹쳐 표시한다.
#
# ⚠️ 아래는 **자리표시자**다. 실제 진화대 위치가 아니라 지도·거리 계산
# 경로를 확인하기 위해 사이트 중심 주변에 임의로 찍은 점이다.
# 파일럿 전에 관할 산림부서에서 실제 좌표를 받아 교체해야 한다.
response_units:
  - name: "(가상) 북측 거점"
    lat: 36.4420
    lon: 128.6900
  - name: "(가상) 남동측 거점"
    lat: 36.3850
    lon: 128.7480
